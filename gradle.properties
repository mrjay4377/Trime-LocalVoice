# https://developer.android.com/build/optimize-your-build#disable-the-jetifier-flag
android.enableJetifier=false
android.useAndroidX=true

# enlarge heap size to 4GB
org.gradle.jvmargs=-Xmx4096M -XX:+HeapDumpOnOutOfMemoryError

# 增量构建提速：并行任务 + 构建缓存（配置缓存与自定义 convention 插件有冲突，暂不开启）
org.gradle.parallel=true
org.gradle.caching=true

# 实机只需 arm64：默认只编译/打包这一套 ABI，省去另外三套 CMake 与 APK 打包时间。
# 如需多架构，用 -PbuildABI=arm64-v8a,armeabi-v7a,x86,x86_64 覆盖，或删掉本行恢复默认。
buildABI=arm64-v8a

# debug 为了精简体积开了 minify，屏蔽 AGP 对 debuggable+minify 的已知告警噪音
android.sync.suppressAgpWarnings=DEBUGGABLE_AND_MINIFIED_ENABLED

# KSP2 https://github.com/google/ksp/blob/main/docs/ksp2.md
ksp.useKSP2=true
